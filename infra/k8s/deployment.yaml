apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-inference
  labels:
    app.kubernetes.io/name: api-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the spool volume writable by the image's runtime user.
        fsGroup: 1000
      containers:
        - name: api
          # Resolved to the published registry image by kustomization.yaml.
          image: api-inference
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-inference-config
            - secretRef:
                name: api-inference-db
          # The initial model load runs inside the app lifespan, so the port
          # only opens after it finishes. With MLflow down that takes minutes
          # (the MLflow client retries internally): allow up to 5 minutes
          # before the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # /health answers 200 even without a model or database, by design:
          # the pod stays up and /predict returns 503 until the model loads.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spool
              mountPath: /app/spool
      volumes:
        # Spool of inference.logs rows the database could not take. An
        # emptyDir survives container restarts but not pod deletion; switch to
        # a StatefulSet with volumeClaimTemplates if those rows must survive
        # rescheduling.
        - name: spool
          emptyDir: {}
