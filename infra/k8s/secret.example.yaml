# Template only: it is NOT listed in kustomization.yaml and must never hold
# real credentials in git. Create the real Secret out of band, for example:
#
#   kubectl -n api-inference create secret generic api-inference-db \
#     --from-literal=TRAIN_DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/DBNAME'
apiVersion: v1
kind: Secret
metadata:
  name: api-inference-db
  labels:
    app.kubernetes.io/name: api-inference
type: Opaque
stringData:
  TRAIN_DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DBNAME"
