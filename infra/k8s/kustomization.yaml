# Apply with: kubectl apply -k infra/k8s
#
# The api-inference-db Secret is not managed here (see secret.example.yaml);
# create it in the namespace before the pods can start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: api-inference

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

images:
  # Image published by .github/workflows/ci-cd-unit-tests-dockerhub.yml as
  # <DOCKERHUB_USERNAME>/api-inference. Its update-manifests job rewrites
  # newName and newTag below with the commit SHA after every publish; Argo CD
  # deploys that commit. The values here are placeholders until the first run.
  - name: api-inference
    newName: docker.io/your-dockerhub-user/api-inference
    newTag: latest
