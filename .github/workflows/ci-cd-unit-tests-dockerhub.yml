name: CI Unit Tests + DockerHub Publish

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/**"
      - "tests/**"
      - "ml/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "ml/**"
      - "Dockerfile"
      - "Dockerfile.test"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"

env:
  PYTHON_VERSION: "3.14"
  APP_PATH: "."
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/api-inference

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: |
          cd "$APP_PATH"
          uv run --locked pytest -q

  publish-dockerhub:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.APP_PATH }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # GitOps hand-off: pin the image just published in infra/k8s so Argo CD,
  # which watches that path, rolls it out. The commit only touches infra/**,
  # which is outside this workflow's path filters, and pushes made with
  # GITHUB_TOKEN do not trigger workflows, so it cannot loop.
  update-manifests:
    needs: publish-dockerhub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-manifests
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin image tag in kustomization
        run: |
          sed -i -E \
            -e "s|^([[:space:]]*newName:).*|\1 docker.io/${IMAGE_NAME}|" \
            -e "s|^([[:space:]]*newTag:).*|\1 ${GITHUB_SHA}|" \
            infra/k8s/kustomization.yaml
          grep -q "newTag: ${GITHUB_SHA}$" infra/k8s/kustomization.yaml
          kubectl kustomize infra/k8s > /dev/null

      - name: Commit and push
        run: |
          if git diff --quiet -- infra/k8s/kustomization.yaml; then
            echo "Manifest already pinned to ${GITHUB_SHA}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(infra): deploy api-inference ${GITHUB_SHA::7}" \
            -- infra/k8s/kustomization.yaml
          git push origin HEAD:main
